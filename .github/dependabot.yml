# Keeps the GitHub Actions in .github/workflows/ current (ADR-0005): within a major, the
# floating version tag picks up new releases by itself; Dependabot raises a PR when an action
# publishes a new major version.
# module:git-conventions begin
# The commit-message prefix yields Conventional-Commit-valid subjects ("build(deps): …")
# per ADR-0004.
# module:git-conventions end
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
