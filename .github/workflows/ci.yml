name: CI

# Language-neutral CI skeleton. Inert by default: it runs only on manual dispatch and does nothing
# but confirm it is wired up, so the repository stays green before a toolchain exists. The base image
# ships no language toolchain (see README) — this file is the place to add build/test/lint once you do.
#
# To activate for your project:
#   1. Add `pull_request:` and `push: { branches: [main] }` to `on:`.
#   2. Replace the `placeholder` job with a job that sets up the toolchain and runs build, test, and
#      lint/format check. The commands MUST match README.md → "Build, Test & Run", the single source
#      of truth for those commands (AGENTS.md §6), and enforce the Definition of Done (AGENTS.md §5).
#      Give it a `timeout-minutes` that fits the real build, and add `submodules: recursive` to the
#      checkout if the project uses git submodules.
#
# Adding a language toolchain or a hard CI dependency is architecture-relevant — record it as an ADR
# first (AGENTS.md §3).
#
# Every job carries a timeout so a hung step cannot occupy a runner until the platform's own
# six-hour limit, and every checkout runs with 'persist-credentials: false': the workflow token is
# needed to fetch the code, not afterwards, and leaving it in .git/config makes it readable to
# every later step — including a build that runs third-party code.

on:
  workflow_dispatch:

permissions:
  contents: read

# Cancel a pull request's superseded runs: a new push makes the previous run's verdict irrelevant,
# while a queued run keeps a required check pending. Runs on 'main' are never cancelled — every
# commit there keeps a result of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  placeholder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "CI skeleton is wired up. Fill in build/test/lint — see this file's header."
