name: CI

# Language-neutral CI skeleton. Inert by default: it runs only on manual dispatch and does nothing
# but confirm it is wired up, so the repository stays green before a toolchain exists. The base image
# ships no language toolchain (see README) — this file is the place to add build/test/lint once you do.
#
# To activate for your project:
#   1. Switch the trigger to pull_request + push (uncomment the block in `on:` below).
#   2. Uncomment the `build-test-lint` job, add a setup step for your toolchain, and fill in the
#      build/test/lint commands. These MUST match README.md → "Build, Test & Run", the single source
#      of truth for those commands (AGENTS.md §6), and enforce the Definition of Done (AGENTS.md §5).
#   3. Delete the `placeholder` job once real jobs run.
#
# Adding a language toolchain or a hard CI dependency is architecture-relevant — record it as an ADR
# first (AGENTS.md §3).
#
# Every job carries a timeout so a hung step cannot occupy a runner until the platform's own
# six-hour limit, and every checkout runs with 'persist-credentials: false': the workflow token is
# needed to fetch the code, not afterwards, and leaving it in .git/config makes it readable to
# every later step — including a build that runs third-party code.

on:
  workflow_dispatch:
  # pull_request:
  # push:
  #   branches: [main]

permissions:
  contents: read

# Cancel a pull request's superseded runs: a new push makes the previous run's verdict irrelevant,
# while a queued run keeps a required check pending. Runs on 'main' are never cancelled — every
# commit there keeps a result of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  placeholder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "CI skeleton is wired up. Fill in build/test/lint — see this file's header."

  # build-test-lint:
  #   runs-on: ${{ matrix.os }}
  #   timeout-minutes: 30   # raise it to fit the real build; never leave a job unbounded
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       os: [ubuntu-latest]
  #       # version: [ ... ]   # e.g. language/runtime versions to test against
  #   steps:
  #     - uses: actions/checkout@v7
  #       with:
  #         persist-credentials: false
  #         # If the project uses git submodules, add `submodules: recursive` — checkout
  #         # leaves them empty by default, and a build against empty directories fails obscurely.
  #     # - name: Set up toolchain
  #     #   run: ...            # install the language/runtime — the base image ships none
  #     - name: Build
  #       run: ...              # README → Build
  #     - name: Test
  #       run: ...              # README → Test (must pass — Definition of Done, AGENTS.md §5)
  #     - name: Lint & format check
  #       run: ...              # linter + formatter in check mode
